name: Build Hospital Management System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hms:password@localhost:5432/hms?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-change-me-before-production-123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Apply versioned migrations to clean PostgreSQL
        working-directory: server
        run: npx prisma migrate deploy
      - name: Verify migration history
        working-directory: server
        run: npx prisma migrate status
      - name: Run backend unit tests
        working-directory: server
        run: npm test
      - name: Check API JavaScript syntax
        run: |
          node --check server/src/index.js
          node --check server/src/routes/auth.js
          node --check server/src/routes/patients.js
          node --check server/src/routes/departments.js
          node --check server/src/routes/appointments.js
          node --check server/src/routes/operations.js
          node --check server/src/routes/doctors.js
          node --check server/src/routes/dashboard.js
          node --check server/src/routes/users.js
          node --check server/src/routes/studio.js
          node --check server/src/routes/inventory.js
          node --check server/src/routes/audit.js
          node --check server/src/middleware/auth.js
          node --check server/src/lib/authorization.js
