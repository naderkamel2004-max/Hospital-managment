name: Generate Initial Database Migration

on:
  push:
    branches: [main]
    paths:
      - 'server/prisma/schema.prisma'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate Prisma schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://hms:password@localhost:5432/hms?schema=public
        run: npx prisma validate
      - name: Generate initial migration SQL
        working-directory: server
        run: |
          mkdir -p prisma/migrations/20261112010000_init
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/20261112010000_init/migration.sql
          test -s prisma/migrations/20261112010000_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prisma/migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "db: add versioned initial PostgreSQL migration"
          git push origin HEAD:main
