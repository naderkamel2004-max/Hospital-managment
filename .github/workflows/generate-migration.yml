name: Initial Migration Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-initial-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate Prisma schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://hms:password@localhost:5432/hms?schema=public
        run: npx prisma validate
      - name: Verify committed initial migration exists
        run: |
          test -s server/prisma/migrations/migration_lock.toml
          test -s server/prisma/migrations/20261112010000_init/migration.sql
      - name: Verify schema and migration are in sync
        working-directory: server
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/expected-migration.sql
          diff -u prisma/migrations/20261112010000_init/migration.sql /tmp/expected-migration.sql
