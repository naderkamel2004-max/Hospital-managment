name: Windows portable desktop build

on:
  workflow_dispatch:
  push:
    branches: [feature/windows-portable-desktop]
    paths:
      - 'package.json'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'server/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
      - '.github/workflows/windows-portable.yml'

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop and frontend dependencies
        run: npm install
      - name: Install API dependencies and generate Windows Prisma client
        working-directory: server
        run: |
          npm install
          npx prisma generate
          $migrationFiles = Get-ChildItem "prisma/migrations" -Filter "migration.sql" -Recurse -ErrorAction SilentlyContinue
          if (-not $migrationFiles) {
            $migrationDir = "prisma/migrations/20261112000000_initial"
            New-Item -ItemType Directory -Force -Path $migrationDir | Out-Null
            Write-Host "No committed Prisma migrations found; generating the initial migration from schema.prisma."
            & node "node_modules/prisma/build/index.js" migrate diff --from-empty --to-schema-datamodel "prisma/schema.prisma" --script |
              Set-Content -Path (Join-Path $migrationDir "migration.sql") -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "Could not generate the initial Prisma migration." }
            if ((Get-Item (Join-Path $migrationDir "migration.sql")).Length -eq 0) { throw "Generated Prisma migration is empty." }
            Set-Content -Path "prisma/migrations/migration_lock.toml" -Value 'provider = "postgresql"' -Encoding utf8
          }
          npm prune --omit=dev
          if (-not (Test-Path "node_modules\\prisma\\build\\index.js")) {
            throw "Prisma CLI is missing from the backend production dependencies after npm prune."
          }
      - name: Build frontend
        run: npm run build
      - name: Download PostgreSQL 17 Windows binaries
        shell: pwsh
        run: |
          $url = "https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\postgres.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\postgres.zip" -DestinationPath "$env:RUNNER_TEMP\postgres"
          $pgSource = Join-Path $env:RUNNER_TEMP "postgres\pgsql"
          $pgTarget = "build-resources\postgres"
          New-Item -ItemType Directory -Force -Path $pgTarget | Out-Null
          foreach ($folder in @("bin", "lib", "share")) {
            Copy-Item (Join-Path $pgSource $folder) $pgTarget -Recurse -Force
          }
      - name: Download bundled Node.js runtime
        shell: pwsh
        run: |
          $url = "https://nodejs.org/dist/v22.23.4/win-x64/node.exe"
          New-Item -ItemType Directory -Force -Path "build-resources\\node" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "build-resources\\node\\node.exe"
      - name: Package portable Windows executable
        run: npm run package:windows
      - name: Verify packaged backend runtime dependencies
        shell: pwsh
        run: |
          $sourceRoot = "server"
          $packagedRoot = "dist-electron\\win-unpacked\\resources\\server"
          $sourceModules = Join-Path $sourceRoot "node_modules"
          $packagedModules = Join-Path $packagedRoot "node_modules"
          $requiredFiles = @(
            "package.json",
            "src/app.js",
            "prisma/schema.prisma",
            "prisma/seed.js",
            "node_modules/prisma/build/index.js",
            "node_modules/@prisma/client/package.json",
            "node_modules/.prisma/client/index.js",
            "node_modules/express/package.json"
          )
          $missing = @()
          foreach ($relative in $requiredFiles) {
            $sourcePath = Join-Path $sourceRoot $relative
            $packagedPath = Join-Path $packagedRoot $relative
            if (-not (Test-Path $sourcePath)) { $missing += "source:$relative" }
            if (-not (Test-Path $packagedPath)) { $missing += "package:$relative" }
          }
          $migrationFiles = @(Get-ChildItem (Join-Path $packagedRoot "prisma/migrations") -Filter "migration.sql" -Recurse -File -ErrorAction SilentlyContinue)
          if ($migrationFiles.Count -eq 0) { $missing += "package:prisma/migrations/**/*.sql" }
          $queryEngines = @(Get-ChildItem (Join-Path $packagedModules ".prisma/client") -Filter "*query_engine*.dll.node" -File -ErrorAction SilentlyContinue)
          if ($queryEngines.Count -eq 0) { $missing += "package:generated Prisma Windows query engine (*.dll.node)" }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Packaged backend runtime verification failed."
            Write-Host "Missing items:"
            $missing | ForEach-Object { Write-Host " - $_" }
            foreach ($root in @($sourceModules, $packagedModules, (Join-Path $packagedRoot "prisma"))) {
              Write-Host "Directory inventory: $root"
              if (Test-Path $root) {
                Get-ChildItem $root -Force -Recurse -File -ErrorAction SilentlyContinue |
                  Select-Object -First 120 -ExpandProperty FullName
              } else {
                Write-Host "MISSING DIRECTORY"
              }
            }
            throw "The portable application does not contain the complete backend production runtime."
          }
          Write-Host "Verified packaged Prisma CLI, Prisma Client, generated Windows query engine, Express, API entry point, seed, schema, and migrations."
          Write-Host "Packaged backend dependency count: $((Get-ChildItem $packagedModules -Directory -ErrorAction SilentlyContinue).Count)"
      - name: Smoke test packaged Windows application as a standard Windows user
        shell: pwsh
        run: |
          $app = (Resolve-Path "dist-electron\win-unpacked\Hospital Management.exe").Path
          $testUser = "hms-smoke"
          $testPassword = ConvertTo-SecureString ("HmsSmoke!" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
          New-LocalUser -Name $testUser -Password $testPassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $credential = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$testUser", $testPassword)
          $testProfile = Join-Path $env:SystemDrive "Users\$testUser"
          $testData = Join-Path $testProfile "AppData\Roaming\HMS-Smoke"
          # Let the standard account create its own directory so its ACLs are correct.
          $process = $null
          try {
            $process = Start-Process -FilePath $app -ArgumentList @("--disable-gpu", "--hms-user-data=$testData") -Credential $credential -LoadUserProfile -PassThru
            $deadline = (Get-Date).AddMinutes(4)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                $log = Join-Path $testData "startup.log"
                if (Test-Path $log) { Get-Content $log | Write-Host }
                throw "Hospital Management exited before the API became healthy. Exit code: $($process.ExitCode)"
              }
              $log = Join-Path $testData "startup.log"
              if (Test-Path $log) {
                $logText = Get-Content $log -Raw
                if ($logText -match "FATAL:") {
                  Write-Host $logText
                  throw "Hospital Management reported a fatal startup error."
                }
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:4000/api/health" -TimeoutSec 3
                if ($health.status -eq "ok") { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $healthy) {
              $log = Join-Path $testData "startup.log"
              if (Test-Path $log) { Get-Content $log | Write-Host }
              throw "Hospital Management did not become healthy within four minutes."
            }
            Write-Host "Windows packaged-app smoke test passed under a standard non-administrator account: /api/health returned status=ok."
          } finally {
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
            Remove-LocalUser -Name $testUser -ErrorAction SilentlyContinue
          }
      - name: Smoke test the final portable EXE under a standard Windows user
        shell: pwsh
        run: |
          $portable = Get-ChildItem "dist-electron" -Filter "Hospital-Management-Portable-*.exe" -File | Select-Object -First 1
          if (-not $portable) { throw "The final portable EXE was not produced." }
          $testUser = "hms-portable-smoke"
          $testPassword = ConvertTo-SecureString ("HmsPortable!" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
          New-LocalUser -Name $testUser -Password $testPassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $credential = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$testUser", $testPassword)
          $testProfile = Join-Path $env:SystemDrive "Users\$testUser"
          $testData = Join-Path $testProfile "AppData\Roaming\HMS-Portable-Smoke"
          $process = $null
          try {
            $process = Start-Process -FilePath $portable.FullName -ArgumentList @("--disable-gpu", "--hms-user-data=$testData") -Credential $credential -LoadUserProfile -PassThru
            $deadline = (Get-Date).AddMinutes(5)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                $log = Join-Path $testData "startup.log"
                if (Test-Path $log) { Get-Content $log | Write-Host }
                throw "The final portable EXE exited before the API became healthy. Exit code: $($process.ExitCode)"
              }
              $log = Join-Path $testData "startup.log"
              if (Test-Path $log) {
                $logText = Get-Content $log -Raw
                if ($logText -match "FATAL:") {
                  Write-Host $logText
                  throw "The final portable EXE reported a fatal startup error."
                }
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4000/api/health" -TimeoutSec 3
                $health = $response.Content | ConvertFrom-Json
                if ($response.StatusCode -eq 200 -and $health.status -eq "ok") { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $healthy) {
              $log = Join-Path $testData "startup.log"
              if (Test-Path $log) { Get-Content $log | Write-Host }
              throw "The final portable EXE did not return HTTP 200 with status=ok within five minutes."
            }
            Write-Host "Final portable EXE smoke test passed: HTTP 200 and status=ok under a standard non-administrator Windows account."
          } finally {
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
            Remove-LocalUser -Name $testUser -ErrorAction SilentlyContinue
          }
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-Management-Portable-Windows-x64
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14
