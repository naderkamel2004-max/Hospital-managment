name: Windows portable desktop build

on:
  workflow_dispatch:
  push:
    branches: [feature/windows-portable-desktop]
    paths:
      - 'package.json'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'server/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
      - '.github/workflows/windows-portable.yml'

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop and frontend dependencies
        run: npm install
      - name: Install API dependencies and generate Windows Prisma client
        working-directory: server
        run: |
          npm install
          npx prisma generate
      - name: Build frontend
        run: npm run build
      - name: Download PostgreSQL 17 Windows binaries
        shell: pwsh
        run: |
          $url = "https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\postgres.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\postgres.zip" -DestinationPath "$env:RUNNER_TEMP\postgres"
          $pgSource = Join-Path $env:RUNNER_TEMP "postgres\pgsql"
          $pgTarget = "build-resources\postgres"
          New-Item -ItemType Directory -Force -Path $pgTarget | Out-Null
          foreach ($folder in @("bin", "lib", "share")) {
            Copy-Item (Join-Path $pgSource $folder) $pgTarget -Recurse -Force
          }
      - name: Download bundled Node.js runtime
        shell: pwsh
        run: |
          $url = "https://nodejs.org/dist/v22.23.4/win-x64/node.exe"
          New-Item -ItemType Directory -Force -Path "build-resources\\node" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "build-resources\\node\\node.exe"
      - name: Package portable Windows executable
        run: npm run package:windows
      - name: Smoke test packaged Windows application as a standard Windows user
        shell: pwsh
        run: |
          $app = (Resolve-Path "dist-electron\win-unpacked\Hospital Management.exe").Path
          $testUser = "hms-smoke"
          $testPassword = ConvertTo-SecureString ("HmsSmoke!" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
          New-LocalUser -Name $testUser -Password $testPassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $credential = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$testUser", $testPassword)
          $testProfile = Join-Path $env:SystemDrive "Users\$testUser"
          $testData = Join-Path $testProfile "AppData\Roaming\Hospital Management"
          New-Item -ItemType Directory -Force -Path $testData | Out-Null
          $env:HMS_TEST_USER_DATA = $testData
          $process = $null
          try {
            $process = Start-Process -FilePath $app -ArgumentList "--disable-gpu" -Credential $credential -LoadUserProfile -PassThru
            $deadline = (Get-Date).AddMinutes(4)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                $log = Join-Path $testData "startup.log"
                if (Test-Path $log) { Get-Content $log | Write-Host }
                throw "Hospital Management exited before the API became healthy. Exit code: $($process.ExitCode)"
              }
              $log = Join-Path $testData "startup.log"
              if (Test-Path $log) {
                $logText = Get-Content $log -Raw
                if ($logText -match "FATAL:") {
                  Write-Host $logText
                  throw "Hospital Management reported a fatal startup error."
                }
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:4000/api/health" -TimeoutSec 3
                if ($health.status -eq "ok") { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $healthy) {
              $log = Join-Path $testData "startup.log"
              if (Test-Path $log) { Get-Content $log | Write-Host }
              throw "Hospital Management did not become healthy within four minutes."
            }
            Write-Host "Windows packaged-app smoke test passed under a standard non-administrator account: /api/health returned status=ok."
          } finally {
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
            Remove-LocalUser -Name $testUser -ErrorAction SilentlyContinue
          }
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Hospital-Management-Portable-Windows-x64
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14
