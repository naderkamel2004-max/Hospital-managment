appId: com.hospitalmanagement.desktop
productName: Hospital Management
asar: true
disableDefaultIgnoredFiles: true
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: server
    to: server
    filter:
      - "**/*"
      - "!**/.env"
      - "!**/test/**"
  - from: build-resources/node
    to: node
    filter:
      - "node.exe"
  - from: build-resources/postgres
    to: postgres
    filter:
      - "**/*"
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: Hospital-Management-Portable-${version}-${arch}.exe
